name: Encerra downloads
# Removes the files of exams whose window (open_until in exams.json) has closed.
# Times in UTC; Brasilia = UTC-3. Runs a few minutes after each deadline (plus a retry),
# on every push that changes exams.json, and on demand.
on:
  schedule:
    - cron: "3 20 23 11 *"    # 23/11 17:03 (prova do dia 1)
    - cron: "30 20 23 11 *"   # 23/11 17:30 (nova tentativa)
    - cron: "3 3 1 12 *"      # 01/12 00:03 (trabalho, prazo 30/11 23:59)
    - cron: "30 3 1 12 *"     # 01/12 00:30 (nova tentativa)
  push:
    branches: [main]
    paths: [exams.json]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  expira:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/expira.py
      - name: Commit e nova publicação do site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nada a remover"; exit 0; fi
          git commit -m "Remove arquivos de avaliações encerradas"
          git push
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
